{% extends 'base.html' %}
{% block title %}Sign in - Prime Video{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-brand"><span class="prime-word">prime</span><span class="video-word">video</span></div>
  <div class="auth-box">
    <h1>Sign in</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">{% csrf_token %}
      <label>Username</label><input name="username" required autofocus>
      <label>Password</label><input name="password" type="password" required>
      <button type="submit" class="primary-btn">Sign in</button>
    </form>
    <div class="divider">New to Prime Video?</div>
    <a class="secondary-btn" href="{% url 'signup' %}">Create your Prime Video account</a>
  </div>
  <p class="auth-footer">© 2026 Prime Video Assignment • Built with Django</p>
</div>
{% endblock %}
