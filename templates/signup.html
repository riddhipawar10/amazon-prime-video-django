{% extends 'base.html' %}
{% block title %}Create account - Prime Video{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-brand"><span class="prime-word">prime</span><span class="video-word">video</span></div>
  <div class="auth-box">
    <h1>Create account</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">{% csrf_token %}
      <label>Your name / Username</label><input name="username" required>
      <label>Email</label><input name="email" type="email" required>
      <label>Password</label><input name="password" type="password" minlength="6" required>
      <button type="submit" class="primary-btn">Create account</button>
    </form>
    <p class="switch-text">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
  </div>
</div>
{% endblock %}
